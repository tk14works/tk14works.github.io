<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>お知らせ | HamaKura Lab</title>
  <link rel="canonical" href="https://tk14.jp/sample/sample/hamakura-lab/news/tsunagu-open-day-202610/">
  <link rel="stylesheet" href="../../assets/css/style.css?v=20260925-9">
</head>
<body class="news-page" id="top">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="../../#top" aria-label="HamaKura Lab トップへ">
        <span class="brand__logo-frame"><img class="brand__logo" src="../../assets/hamakura-logo.png" width="2000" height="2000" alt=""></span>
        <span class="brand__name">HamaKura Lab</span>
      </a>
      <button class="site-menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="news-main-nav" data-home-nav-toggle>Menu</button>
      <nav class="site-nav site-nav--home" id="news-main-nav" aria-label="メインナビゲーション" data-home-nav>
        <a href="../../#people">対象の方</a>
        <a href="../../#message">代表メッセージ</a>
        <a href="../../#activities">活動実績</a>
        <a href="../../#faq">よくある質問</a>
        <a class="button button--header" href="https://www.instagram.com/hamakura__lab?stkn=MTJ4aDhweDk3aWhkbA==">Instagramで相談する</a>
        <a class="site-nav__contact" href="../../#contact">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <main>
    <nav class="news-breadcrumb" aria-label="パンくずリスト">
      <div class="container news-breadcrumb__inner">
        <a href="../../#top">ホーム</a>
        <span class="news-breadcrumb__separator" aria-hidden="true">›</span>
        <span aria-current="page">10月のつなぐ鎌倉の開放日のお知らせ</span>
      </div>
    </nav>

    <article class="news-detail section section--mint" aria-labelledby="news-detail-title">
      <div class="container news-detail__inner">
        <h1 id="news-detail-title">10月のつなぐ鎌倉の開放日のお知らせ</h1>
        <p class="news-detail__date">2026.09.25</p>
        <figure class="news-detail__image">
          <img src="../../assets/news/2026-10-tsunagu-kamakura.jpg" width="839" height="1492" alt="10月開放日のご案内。各日の開放状況と対応者を示した一覧">
        </figure>
        <div class="news-detail__copy">
          <p>18日はつなぐ鎌倉でのイベントの為、<br class="news-detail__mobile-break">午前中のみの対応となります。</p>
          <p>25日は横浜でHKLがイベントに出店する為、<br class="news-detail__mobile-break">お休みとなります。</p>
        </div>
        <a class="news-detail__about button button--header" href="../../tsunagu-kamakura/">つなぐ鎌倉の詳細を見る</a>
        <a class="news-detail__back" href="../../#top">トップページに戻る <span aria-hidden="true">←</span></a>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__bottom"><small>© HamaKura Lab</small></div>
  </footer>
  <script>
    (() => {
      const nav = document.querySelector('[data-home-nav]');
      const toggle = document.querySelector('[data-home-nav-toggle]');
      if (!nav || !toggle) return;

      const setOpen = (isOpen) => {
        nav.classList.toggle('is-open', isOpen);
        toggle.setAttribute('aria-expanded', String(isOpen));
        toggle.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
      };

      toggle.addEventListener('click', () => setOpen(!nav.classList.contains('is-open')));
      nav.addEventListener('click', (event) => {
        if (event.target.closest('a')) setOpen(false);
      });
      document.addEventListener('click', (event) => {
        if (!nav.contains(event.target) && !toggle.contains(event.target)) setOpen(false);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && nav.classList.contains('is-open')) {
          setOpen(false);
          toggle.focus();
        }
      });
      window.addEventListener('resize', () => {
        if (window.innerWidth >= 960) setOpen(false);
      });
    })();
  </script>
</body>
</html>
