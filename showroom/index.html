<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>tk14 | LP制作見本</title>
  <meta name="description" content="tk14が制作した2つのLPをご紹介します。目的に合わせた設計と、画面全体の見せ方をご覧ください。">
  <link rel="stylesheet" href="assets/css/showroom.css?v=22">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="showroom-header">
    <a class="showroom-brand" href="./" aria-label="tk14 LP制作 トップ">
      <span class="showroom-brand-wordmark">tk14</span>
      <span class="showroom-brand-copy">
        <small>LP制作</small>
      </span>
    </a>

    <button class="menu-button" type="button" aria-expanded="false" aria-controls="showroom-navigation" aria-label="メニューを開く" title="メニュー">
      <span></span>
      <span></span>
    </button>

    <nav id="showroom-navigation" class="showroom-nav" aria-label="主要ナビゲーション">
      <a href="#works">制作例</a>
      <a href="../ai/">AI・DX活用サポート</a>
    </nav>
  </header>

  <main id="main">
    <section class="portfolio-page-header" aria-labelledby="portfolio-title">
      <div class="portfolio-container">
        <div class="portfolio-page-header__top">
          <p class="eyebrow">Selected Works</p>
        </div>
        <h1 id="portfolio-title">LP制作事例</h1>
        <p class="portfolio-page-header__lead">目的や業種に合わせて設計したLPをご紹介します。</p>
      </div>
    </section>

    <section id="works" class="works-section" aria-labelledby="works-title">
      <div class="portfolio-container">
        <h2 id="works-title" class="sr-only">制作例</h2>

        <div class="work-grid">
          <article class="work-card" data-reveal>
            <a class="work-card__visual" href="samples/beauty-lp/" aria-label="美容室LPを見る">
              <img src="assets/images/showroom/beauty-lp-preview.jpg" width="900" height="675" alt="美容室LPのデザインプレビュー" decoding="async" fetchpriority="high">
            </a>
            <div class="work-card__body">
              <h3>美容サロンLP</h3>
              <div class="work-card__support">
                <p class="work-card__description">写真を主役に、予約まで自然につなげる設計。</p>
                <a class="work-card__link" href="samples/beauty-lp/">LPを見る <span aria-hidden="true">↗</span></a>
              </div>
            </div>
          </article>

          <article class="work-card" data-reveal>
            <a class="work-card__visual work-card__visual--course" href="samples/ai-course/" aria-label="AI業務効率化講座LPを見る">
              <img src="assets/images/showroom/ai-course-preview.jpg" width="900" height="675" alt="AI業務効率化講座LPのデザインプレビュー" decoding="async">
            </a>
            <div class="work-card__body">
              <h3>AI活用講座LP</h3>
              <div class="work-card__support">
                <p class="work-card__description">課題の提示から申込までを、一続きで伝える設計。</p>
                <a class="work-card__link" href="samples/ai-course/">LPを見る <span aria-hidden="true">↗</span></a>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>

    <section class="portfolio-cta" aria-labelledby="portfolio-cta-title">
      <div class="portfolio-container portfolio-cta__inner" data-reveal>
        <h2 id="portfolio-cta-title">LP制作について相談する</h2>
        <p>目的や内容を伺いながら、必要なページを一緒に整理します。</p>
        <a class="text-link" href="../ai/">相談する <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <footer class="showroom-footer">
    <div class="showroom-footer__top">
      <div>
        <strong>tk14</strong>
        <p>LP制作</p>
      </div>
      <nav aria-label="フッターナビゲーション">
        <a href="../ai/">tk14 AI</a>
        <a href="../ai/#contact">お問い合わせ</a>
      </nav>
    </div>
    <p class="showroom-note">掲載している店舗・講座は、LP制作事例として作成した架空のサンプルです。</p>
  </footer>

  <script src="assets/js/showroom.js"></script>
</body>
</html>
